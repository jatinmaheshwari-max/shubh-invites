<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-100 -100 200 200" width="400" height="400">
    <defs>
        <path id="p-outer"  d="M0 -94 C10 -86 10 -76 0 -72 C-10 -76 -10 -86 0 -94Z"/>
        <path id="p-middle" d="M0 -72 C13 -63 13 -54 0 -50 C-13 -54 -13 -63 0 -72Z"/>
        <path id="p-inner"  d="M0 -50 C15 -42 15 -34 0 -30 C-15 -34 -15 -42 0 -50Z"/>
        <path id="p-core"   d="M0 -30 C7 -23 7 -16 0 -12 C-7 -16 -7 -23 0 -30Z"/>
        <circle id="dot" cx="0" cy="-97" r="1.6"/>
    </defs>

    <g fill="none" stroke="#c8962e" stroke-width="0.8">
        <circle r="98"/>
        <circle r="94"/>
        <circle r="72"/>
        <circle r="50"/>
        <circle r="30"/>
        <circle r="12"/>
        <circle r="6"/>
    </g>

    <!-- Outer ring: 16 petals -->
    <g fill="#ff6b2c" fill-opacity="0.14" stroke="#c8962e" stroke-width="0.8">
        <use xlink:href="#p-outer" href="#p-outer"/>
        <use xlink:href="#p-outer" href="#p-outer" transform="rotate(22.5)"/>
        <use xlink:href="#p-outer" href="#p-outer" transform="rotate(45)"/>
        <use xlink:href="#p-outer" href="#p-outer" transform="rotate(67.5)"/>
        <use xlink:href="#p-outer" href="#p-outer" transform="rotate(90)"/>
        <use xlink:href="#p-outer" href="#p-outer" transform="rotate(112.5)"/>
        <use xlink:href="#p-outer" href="#p-outer" transform="rotate(135)"/>
        <use xlink:href="#p-outer" href="#p-outer" transform="rotate(157.5)"/>
        <use xlink:href="#p-outer" href="#p-outer" transform="rotate(180)"/>
        <use xlink:href="#p-outer" href="#p-outer" transform="rotate(202.5)"/>
        <use xlink:href="#p-outer" href="#p-outer" transform="rotate(225)"/>
        <use xlink:href="#p-outer" href="#p-outer" transform="rotate(247.5)"/>
        <use xlink:href="#p-outer" href="#p-outer" transform="rotate(270)"/>
        <use xlink:href="#p-outer" href="#p-outer" transform="rotate(292.5)"/>
        <use xlink:href="#p-outer" href="#p-outer" transform="rotate(315)"/>
        <use xlink:href="#p-outer" href="#p-outer" transform="rotate(337.5)"/>
    </g>

    <!-- Dots on the rim -->
    <g fill="#c8962e">
        <use xlink:href="#dot" href="#dot" transform="rotate(11.25)"/>
        <use xlink:href="#dot" href="#dot" transform="rotate(33.75)"/>
        <use xlink:href="#dot" href="#dot" transform="rotate(56.25)"/>
        <use xlink:href="#dot" href="#dot" transform="rotate(78.75)"/>
        <use xlink:href="#dot" href="#dot" transform="rotate(101.25)"/>
        <use xlink:href="#dot" href="#dot" transform="rotate(123.75)"/>
        <use xlink:href="#dot" href="#dot" transform="rotate(146.25)"/>
        <use xlink:href="#dot" href="#dot" transform="rotate(168.75)"/>
        <use xlink:href="#dot" href="#dot" transform="rotate(191.25)"/>
        <use xlink:href="#dot" href="#dot" transform="rotate(213.75)"/>
        <use xlink:href="#dot" href="#dot" transform="rotate(236.25)"/>
        <use xlink:href="#dot" href="#dot" transform="rotate(258.75)"/>
        <use xlink:href="#dot" href="#dot" transform="rotate(281.25)"/>
        <use xlink:href="#dot" href="#dot" transform="rotate(303.75)"/>
        <use xlink:href="#dot" href="#dot" transform="rotate(326.25)"/>
        <use xlink:href="#dot" href="#dot" transform="rotate(348.75)"/>
    </g>

    <!-- Middle ring: 12 petals -->
    <g fill="#e0337a" fill-opacity="0.14" stroke="#c8962e" stroke-width="0.8">
        <use xlink:href="#p-middle" href="#p-middle"/>
        <use xlink:href="#p-middle" href="#p-middle" transform="rotate(30)"/>
        <use xlink:href="#p-middle" href="#p-middle" transform="rotate(60)"/>
        <use xlink:href="#p-middle" href="#p-middle" transform="rotate(90)"/>
        <use xlink:href="#p-middle" href="#p-middle" transform="rotate(120)"/>
        <use xlink:href="#p-middle" href="#p-middle" transform="rotate(150)"/>
        <use xlink:href="#p-middle" href="#p-middle" transform="rotate(180)"/>
        <use xlink:href="#p-middle" href="#p-middle" transform="rotate(210)"/>
        <use xlink:href="#p-middle" href="#p-middle" transform="rotate(240)"/>
        <use xlink:href="#p-middle" href="#p-middle" transform="rotate(270)"/>
        <use xlink:href="#p-middle" href="#p-middle" transform="rotate(300)"/>
        <use xlink:href="#p-middle" href="#p-middle" transform="rotate(330)"/>
    </g>

    <!-- Inner ring: 8 petals -->
    <g fill="#6a2c91" fill-opacity="0.12" stroke="#c8962e" stroke-width="0.8">
        <use xlink:href="#p-inner" href="#p-inner"/>
        <use xlink:href="#p-inner" href="#p-inner" transform="rotate(45)"/>
        <use xlink:href="#p-inner" href="#p-inner" transform="rotate(90)"/>
        <use xlink:href="#p-inner" href="#p-inner" transform="rotate(135)"/>
        <use xlink:href="#p-inner" href="#p-inner" transform="rotate(180)"/>
        <use xlink:href="#p-inner" href="#p-inner" transform="rotate(225)"/>
        <use xlink:href="#p-inner" href="#p-inner" transform="rotate(270)"/>
        <use xlink:href="#p-inner" href="#p-inner" transform="rotate(315)"/>
    </g>

    <!-- Core flower -->
    <g fill="#f7a928" fill-opacity="0.3" stroke="#c8962e" stroke-width="0.8">
        <use xlink:href="#p-core" href="#p-core"/>
        <use xlink:href="#p-core" href="#p-core" transform="rotate(45)"/>
        <use xlink:href="#p-core" href="#p-core" transform="rotate(90)"/>
        <use xlink:href="#p-core" href="#p-core" transform="rotate(135)"/>
        <use xlink:href="#p-core" href="#p-core" transform="rotate(180)"/>
        <use xlink:href="#p-core" href="#p-core" transform="rotate(225)"/>
        <use xlink:href="#p-core" href="#p-core" transform="rotate(270)"/>
        <use xlink:href="#p-core" href="#p-core" transform="rotate(315)"/>
    </g>

    <circle r="4" fill="#e0337a" fill-opacity="0.5"/>
</svg>
