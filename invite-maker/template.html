<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Libesole Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=DM+Sans:wght@500;700&family=Great+Vibes&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
    /*
     * Animated wedding invitation, 1080 × 1920 (9:16).
     * Driven entirely by renderAt(t) so every frame is exact when
     * the server captures it. In preview mode it plays in real time.
     */

    html, body { margin: 0; background: #111; overflow: hidden; }

    #stage {
        position: relative; width: 1080px; height: 1920px; overflow: hidden;
        transform-origin: 0 0; font-family: "DM Sans", sans-serif; color: var(--text);
    }

    /* ---------- Themes ---------- */
    .theme-royal {
        --bg: radial-gradient(circle at 50% 28%, #a3203f 0%, #6b0f2a 45%, #2a0a1a 100%);
        --text: #fff3dc; --soft: rgba(255, 236, 205, 0.78); --gold: #f3d38b; --accent: #ff9ec4;
        --line: rgba(243, 211, 139, 0.75); --line-soft: rgba(243, 211, 139, 0.35);
        --card: rgba(255, 255, 255, 0.08);
        --goldgrad: linear-gradient(90deg, #f3d38b, #fff6d6, #e8b65a, #f3d38b);
        --mandala: 0.28;
    }
    .theme-peacock {
        --bg: radial-gradient(circle at 50% 28%, #138a8a 0%, #0a4f5c 45%, #1f1446 100%);
        --text: #f1fbf8; --soft: rgba(225, 245, 240, 0.8); --gold: #f3d38b; --accent: #7fe0c9;
        --line: rgba(243, 211, 139, 0.75); --line-soft: rgba(243, 211, 139, 0.35);
        --card: rgba(255, 255, 255, 0.08);
        --goldgrad: linear-gradient(90deg, #f3d38b, #fff6d6, #7fe0c9, #f3d38b);
        --mandala: 0.28;
    }
    .theme-blush {
        --bg: radial-gradient(circle at 50% 25%, #fffafc 0%, #ffe6ef 50%, #ffd8c6 100%);
        --text: #6b1238; --soft: rgba(107, 18, 56, 0.72); --gold: #c08a2e; --accent: #e0337a;
        --line: rgba(192, 138, 46, 0.7); --line-soft: rgba(192, 138, 46, 0.3);
        --card: rgba(255, 255, 255, 0.7);
        --goldgrad: linear-gradient(90deg, #b81d5f, #e0337a, #ff8a5c, #b81d5f);
        --mandala: 0.45;
    }
    .theme-marigold {
        --bg: radial-gradient(circle at 50% 25%, #fff6c9 0%, #ffd23f 55%, #ff9f1c 100%);
        --text: #6b2400; --soft: rgba(107, 36, 0, 0.75); --gold: #b3430b; --accent: #c2185b;
        --line: rgba(179, 67, 11, 0.6); --line-soft: rgba(179, 67, 11, 0.28);
        --card: rgba(255, 252, 240, 0.78);
        --goldgrad: linear-gradient(90deg, #9c3d00, #c2185b, #e8590c, #9c3d00);
        --mandala: 0.5;
    }

    /* ---------- Fixed layers ---------- */
    .bg { position: absolute; inset: 0; background: var(--bg); }
    .mandala { position: absolute; width: 1500px; left: -210px; top: 210px; opacity: var(--mandala); }
    .toran { position: absolute; left: 0; right: 0; top: 0; height: 150px; z-index: 6;
             background: url("/assets/toran.svg") repeat-x top center / 220px 150px;
             filter: drop-shadow(0 6px 6px rgba(0, 0, 0, 0.25)); }
    .frame { position: absolute; inset: 44px; border: 3px solid var(--line); border-radius: 30px; z-index: 2; }
    .frame::after { content: ""; position: absolute; inset: 14px; border: 1px solid var(--line-soft); border-radius: 22px; }
    .petal { position: absolute; left: 0; top: 0; width: 26px; height: 18px; border-radius: 150% 0 150% 0; z-index: 5; opacity: 0.9; }
    .watermark { position: absolute; left: 0; right: 0; bottom: 74px; z-index: 6; text-align: center;
                 font: 700 22px "DM Sans", sans-serif; letter-spacing: 0.18em; color: var(--soft); }

    /* ---------- Scenes ---------- */
    .scene { position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center;
             justify-content: center; text-align: center; padding: 220px 120px 210px; box-sizing: border-box;
             opacity: 0; visibility: hidden; }
    .scene > * { will-change: transform, opacity; }

    .blessing { font-family: "Tiro Devanagari Hindi", "Cormorant Garamond", serif; font-size: 58px; color: var(--gold); line-height: 1.4; }
    .small { font: 700 28px/1.6 "DM Sans", sans-serif; letter-spacing: 0.22em; text-transform: uppercase; color: var(--soft); }
    .line { font: italic 500 58px/1.25 "Cormorant Garamond", serif; color: var(--text); }
    .divider { margin: 34px 0; font-size: 40px; color: var(--gold); letter-spacing: 0.6em; padding-left: 0.6em; }

    .name { font-family: "Great Vibes", cursive; font-size: 190px; line-height: 1.15; padding: 0 30px;
            background: var(--goldgrad); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent; }
    .amp { font-family: "Great Vibes", cursive; font-size: 110px; line-height: 1; color: var(--accent); margin: -10px 0; }
    .parents { font: italic 500 40px/1.35 "Cormorant Garamond", serif; color: var(--soft); margin-top: 6px; }

    .arch { width: 520px; height: 660px; border-radius: 260px 260px 30px 30px; overflow: hidden; margin-bottom: 40px;
            border: 10px solid var(--gold); box-shadow: 0 30px 70px rgba(0, 0, 0, 0.35); }
    .arch img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; }

    .date-day { font: 700 300px/0.9 "Cormorant Garamond", serif; background: var(--goldgrad); background-size: 200% auto;
                -webkit-background-clip: text; background-clip: text; color: transparent; }
    .date-month { font: 600 72px/1.1 "Cormorant Garamond", serif; letter-spacing: 0.28em; padding-left: 0.28em; color: var(--text); }
    .date-week { margin-top: 18px; }
    .venue { font: 600 64px/1.2 "Cormorant Garamond", serif; color: var(--text); }

    .event-card { width: 800px; padding: 70px 60px 76px; border-radius: 44px; background: var(--card);
                  border: 2px solid var(--line); box-sizing: border-box; box-shadow: 0 30px 70px rgba(0, 0, 0, 0.2); }
    .event-icon { font-size: 130px; line-height: 1.2; }
    .event-name { font-family: "Great Vibes", cursive; font-size: 150px; line-height: 1.15;
                  background: var(--goldgrad); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent; }
    .event-when { font: 600 56px/1.3 "Cormorant Garamond", serif; color: var(--text); margin-top: 10px; }
    .event-where { font: italic 500 46px/1.3 "Cormorant Garamond", serif; color: var(--soft); margin-top: 12px; }

    .polaroid { position: absolute; width: 540px; height: 680px; padding: 18px 18px 80px; box-sizing: border-box; background: #fff;
                box-shadow: 0 30px 70px rgba(0, 0, 0, 0.35); }
    .polaroid img { width: 100%; height: 100%; object-fit: cover; }

    .closing { font: italic 600 70px/1.25 "Cormorant Garamond", serif; color: var(--text); }
    .rsvp { font: 600 48px/1.4 "Cormorant Garamond", serif; color: var(--text); }
</style>
</head>
<body>

<div id="stage" class="theme-royal">
    <div class="bg"></div>
    <img class="mandala" id="mandala" src="/assets/mandala.svg" alt="">
    <div class="frame"></div>
    <div class="toran" id="toran"></div>
    <div id="petals"></div>
    <div id="scenes"></div>
    <div class="watermark" id="watermark">INVITATION BY LIBESOLE · INVITES.LIBESOLE.COM</div>
</div>

<script>
/* ============================================================
   Helpers
============================================================ */

const stage = document.getElementById("stage");
const scenesRoot = document.getElementById("scenes");

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const easeOut = (p) => 1 - Math.pow(1 - p, 3);
const backOut = (p) => { const c = 1.7; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };

/* Seeded random so every render looks identical */
function rng(seed) {
    return () => {
        seed |= 0; seed = seed + 0x6D2B79F5 | 0;
        let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}

function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
}

function formatDate(iso, style) {
    if (!iso) return "";
    const d = new Date(iso + "T12:00:00");
    if (isNaN(d)) return iso;
    if (style === "short") {
        return d.toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short" });
    }
    return {
        day: d.getDate(),
        month: d.toLocaleDateString("en-IN", { month: "long" }).toUpperCase(),
        year: d.getFullYear(),
        weekday: d.toLocaleDateString("en-IN", { weekday: "long" })
    };
}

const EVENT_ICONS = [
    [/haldi/i, "🌼"], [/mehendi|mehndi/i, "🌿"], [/sangeet|music|dance/i, "🎶"],
    [/reception|party|dinner/i, "🥂"], [/wedding|vivah|shaadi|pheras|lagan/i, "💍"],
    [/engage|roka|ring|sagai/i, "💞"], [/tilak|puja|pooja|ganesh/i, "🪔"], [/baraat/i, "🐎"]
];
const eventIcon = (name) => (EVENT_ICONS.find(([re]) => re.test(name)) || [null, "✨"])[1];

/* Shrink long text so it always fits */
function fitName(node, text, base) {
    const len = [...text].length;
    node.style.fontSize = (len <= 8 ? base : Math.max(base * 8 / len, base * 0.55)) + "px";
}

/* ============================================================
   Timeline
============================================================ */

let TIMELINE = [];
let DURATION = 0;
let PETALS = [];

function addScene(duration, build) {
    const node = el("div", "scene");
    scenesRoot.appendChild(node);
    const scene = { node, start: DURATION, duration, items: [] };
    const add = (child, at = 0, fx = "up", extra = {}) => {
        node.appendChild(child);
        scene.items.push({ node: child, at, fx, ...extra });
        return child;
    };
    build(node, add);
    TIMELINE.push(scene);
    DURATION += duration;
}

function applyFx(item, p, local, sceneDuration) {
    const e = easeOut(p);
    let transform = "";
    let opacity = e;

    switch (item.fx) {
        case "fade":  break;
        case "up":    transform = `translateY(${(1 - e) * 70}px)`; break;
        case "left":  transform = `translateX(${-(1 - e) * 160}px)`; break;
        case "right": transform = `translateX(${(1 - e) * 160}px)`; break;
        case "zoom":  transform = `scale(${0.82 + 0.18 * e})`; break;
        case "pop":   transform = `scale(${p <= 0 ? 0.3 : 0.3 + 0.7 * backOut(p)})`; opacity = clamp(p * 2); break;
        case "drop":  transform = `translate(${item.x}px, ${item.y - (1 - e) * 500}px) rotate(${item.rot + (1 - e) * 25}deg)`; break;
        case "kb":    transform = `scale(${0.85 + 0.15 * e})`; break;
    }

    item.node.style.opacity = opacity;
    item.node.style.transform = transform;

    /* Slow Ken Burns zoom on photos inside arches */
    if (item.fx === "kb") {
        const img = item.node.querySelector("img");
        if (img) img.style.transform = `scale(${1.15 - 0.15 * clamp(local / sceneDuration)})`;
    }
}

/* Draw one exact moment in time (seconds) */
window.renderAt = function (t) {
    document.getElementById("mandala").style.transform = `rotate(${t * 5}deg)`;
    document.getElementById("toran").style.transform = `translateY(${(easeOut(clamp(t / 1.3)) - 1) * 170}px)`;

    PETALS.forEach((p) => {
        const y = ((t * p.speed + p.offset) % 2150) - 120;
        const x = p.x + Math.sin(t * p.sway + p.phase) * 45;
        p.node.style.transform = `translate(${x}px, ${y}px) rotate(${t * p.spin}deg)`;
    });

    const shimmer = `${(t * 35) % 200}% center`;
    stage.querySelectorAll(".name, .event-name, .date-day").forEach((n) => { n.style.backgroundPosition = shimmer; });

    TIMELINE.forEach((scene, index) => {
        const local = t - scene.start;
        const last = index === TIMELINE.length - 1;
        const visible = local >= 0 && (local <= scene.duration || last);

        if (!visible) {
            scene.node.style.visibility = "hidden";
            return;
        }

        const fadeIn = index === 0 ? 1 : clamp(local / 0.6);
        const fadeOut = last ? 1 : clamp((scene.duration - local) / 0.6);

        scene.node.style.visibility = "visible";
        scene.node.style.opacity = Math.min(fadeIn, fadeOut);

        scene.items.forEach((item) => {
            applyFx(item, clamp((local - item.at) / 0.9), local, scene.duration);
        });
    });
};

/* ============================================================
   Build the invitation from client data
============================================================ */

window.setupInvite = async function (data) {
    TIMELINE = [];
    DURATION = 0;
    scenesRoot.innerHTML = "";

    stage.className = "theme-" + (data.theme || "royal");
    document.getElementById("watermark").style.display = data.watermark === false ? "none" : "";

    /* Petals */
    const petalBox = document.getElementById("petals");
    petalBox.innerHTML = "";
    const rand = rng(7);
    const colours = ["#ff5fa2", "#ffd166", "#ff8a4c", "#ffc2d6", "#fff3b0"];
    PETALS = Array.from({ length: 28 }, () => {
        const node = el("span", "petal");
        const size = 16 + rand() * 18;
        node.style.width = size + "px";
        node.style.height = size * 0.7 + "px";
        node.style.background = colours[Math.floor(rand() * colours.length)];
        petalBox.appendChild(node);
        return { node, x: rand() * 1080, offset: rand() * 2150, speed: 110 + rand() * 120,
                 sway: 0.6 + rand() * 0.8, phase: rand() * 6, spin: 30 + rand() * 90 };
    });

    const first = data.showFirst === "bride" ? data.bride : data.groom;
    const second = data.showFirst === "bride" ? data.groom : data.bride;
    const firstParents = data.showFirst === "bride" ? data.brideParents : data.groomParents;
    const secondParents = data.showFirst === "bride" ? data.groomParents : data.brideParents;

    /* 1 · Blessing & invitation line */
    addScene(5, (s, add) => {
        if (data.blessing) add(el("div", "blessing", data.blessing), 0.5, "zoom");
        add(el("div", "divider", "❁ ❁ ❁"), 0.9, "fade");
        if (data.introLine) add(el("div", "small", data.introLine), 1.3, "up");
        if (data.inviteLine) add(el("div", "line", data.inviteLine), 2.0, "up").style.marginTop = "30px";
    });

    /* 2 · Couple */
    addScene(6.5, (s, add) => {
        if (data.couplePhoto) {
            const arch = el("div", "arch");
            const img = el("img");
            img.src = data.couplePhoto;
            arch.appendChild(img);
            add(arch, 0.1, "kb");
        }
        const photo = !!data.couplePhoto;
        const n1 = add(el("div", "name", first), photo ? 0.9 : 0.4, "left");
        fitName(n1, first || "", photo ? 150 : 200);
        add(el("div", "amp", "&"), photo ? 1.4 : 1.0, "pop");
        const n2 = add(el("div", "name", second), photo ? 1.8 : 1.5, "right");
        fitName(n2, second || "", photo ? 150 : 200);
        if (!photo && (firstParents || secondParents)) {
            if (firstParents) add(el("div", "parents", firstParents), 2.4, "fade");
            if (secondParents) add(el("div", "parents", secondParents), 2.7, "fade");
        }
    });

    /* 2b · Parents (only when a photo took the space) */
    if (data.couplePhoto && (firstParents || secondParents)) {
        addScene(4.5, (s, add) => {
            add(el("div", "small", "With the blessings of"), 0.3, "up");
            add(el("div", "divider", "❁"), 0.6, "fade");
            if (firstParents) add(el("div", "line", firstParents), 0.9, "up");
            if (firstParents && secondParents) add(el("div", "amp", "&"), 1.3, "pop");
            if (secondParents) add(el("div", "line", secondParents), 1.6, "up");
        });
    }

    /* 3 · Save the date */
    if (data.date) {
        const d = formatDate(data.date);
        addScene(5.5, (s, add) => {
            add(el("div", "small", "Save the date"), 0.2, "up");
            add(el("div", "date-day", d.day), 0.5, "zoom");
            add(el("div", "date-month", `${d.month} ${d.year}`), 0.9, "up");
            add(el("div", "small date-week", [d.weekday, data.time].filter(Boolean).join(" · ")), 1.2, "up");
            if (data.venue || data.city) {
                add(el("div", "divider", "❁"), 1.5, "fade");
                if (data.venue) add(el("div", "venue", data.venue), 1.7, "up");
                if (data.city) add(el("div", "small", data.city), 2.0, "up");
            }
        });
    }

    /* 4 · Events, one per scene */
    const events = (data.events || []).filter((e) => e && e.name);
    events.forEach((event, i) => {
        addScene(3.6, (s, add) => {
            add(el("div", "small", `Celebrations · ${i + 1} of ${events.length}`), 0.1, "up").style.marginBottom = "40px";
            const card = el("div", "event-card");
            card.appendChild(el("div", "event-icon", eventIcon(event.name)));
            const name = el("div", "event-name", event.name);
            fitName(name, event.name, 150);
            card.appendChild(name);
            const when = [formatDate(event.date, "short"), event.time].filter(Boolean).join(" · ");
            if (when) card.appendChild(el("div", "event-when", when));
            if (event.venue) card.appendChild(el("div", "event-where", event.venue));
            add(card, 0.3, "zoom");
        });
    });

    /* 5 · Photo gallery */
    const gallery = (data.gallery || []).filter(Boolean).slice(0, 4);
    if (gallery.length) {
        const spots = [
            { x: 150, y: 340, rot: -7 }, { x: 400, y: 480, rot: 6 },
            { x: 170, y: 820, rot: 5 },  { x: 390, y: 960, rot: -6 }
        ];
        addScene(2.2 + gallery.length * 1.1, (s, add) => {
            s.style.display = "block";
            add(el("div", "small", data.galleryTitle || "Our moments"), 0.1, "up").style.cssText += "position:absolute;left:0;right:0;top:230px;";
            gallery.forEach((src, i) => {
                const card = el("div", "polaroid");
                const img = el("img");
                img.src = src;
                card.appendChild(img);
                card.style.left = "0";
                card.style.top = "0";
                const spot = spots[i];
                add(card, 0.4 + i * 1.0, "drop", { x: spot.x, y: spot.y, rot: spot.rot });
            });
        });
    }

    /* 6 · Closing & RSVP */
    addScene(6.5, (s, add) => {
        add(el("div", "closing", data.closing || "Your presence will make our celebration complete"), 0.3, "up");
        add(el("div", "divider", "❁ ❁ ❁"), 1.0, "fade");
        if (data.rsvp) {
            add(el("div", "small", "RSVP"), 1.3, "up");
            add(el("div", "rsvp", data.rsvp), 1.5, "up");
        }
        if (data.signOff) add(el("div", "line", data.signOff), 2.1, "up").style.marginTop = "40px";
    });

    window.inviteDuration = DURATION;

    /* Wait for fonts and images so the first frame is complete */
    await document.fonts.ready;
    await Promise.all([...stage.querySelectorAll("img")].map((img) =>
        img.complete ? Promise.resolve() : new Promise((r) => { img.onload = img.onerror = r; })
    ));

    window.renderAt(0);
    return DURATION;
};

/* ============================================================
   Preview mode: plays in real time, scaled to fit the window
============================================================ */

if (new URLSearchParams(location.search).has("preview")) {
    const fit = () => {
        const scale = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
        stage.style.transform = `scale(${scale})`;
        document.body.style.width = window.innerWidth + "px";
        stage.style.marginLeft = (window.innerWidth - 1080 * scale) / 2 + "px";
    };
    window.addEventListener("resize", fit);
    fit();

    let startTime = null;
    const loop = (now) => {
        if (DURATION > 0) {
            if (startTime === null) startTime = now;
            window.renderAt(((now - startTime) / 1000) % (DURATION + 1));
        }
        requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);

    window.addEventListener("message", async (event) => {
        if (event.data && event.data.type === "invite-data") {
            startTime = null;
            await window.setupInvite(event.data.data);
        }
    });
    window.parent.postMessage({ type: "preview-ready" }, "*");
}
</script>
</body>
</html>
